<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Merkai Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens dark ── */
[data-theme="dark"] {
  --bg:        #0f0f12;
  --bg2:       #16161a;
  --bg3:       #1e1e24;
  --bg4:       #26262e;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --text:      #f0eff4;
  --text2:     #9896a6;
  --text3:     #5c5b6a;
  --shadow:    rgba(0,0,0,0.5);
  --card-glow: rgba(124,106,240,0.18);
  --shell-bg:  radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,106,240,0.14) 0%, transparent 70%);
  --device-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  --login-glow: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(124,106,240,0.35) 0%, transparent 65%);
}

/* ── Tokens light ── */
[data-theme="light"] {
  --bg:        #f5f4f8;
  --bg2:       #ffffff;
  --bg3:       #f0eef6;
  --bg4:       #e6e3f0;
  --border:    rgba(0,0,0,0.07);
  --border2:   rgba(0,0,0,0.12);
  --text:      #1a1828;
  --text2:     #6b6880;
  --text3:     #a09eb0;
  --shadow:    rgba(100,90,160,0.10);
  --card-glow: rgba(124,106,240,0.08);
  --shell-bg:  radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,106,240,0.07) 0%, transparent 70%);
  --device-shadow: 0 0 0 1px rgba(124,106,240,0.12), 0 32px 60px rgba(100,90,160,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
  --login-glow: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(124,106,240,0.18) 0%, transparent 65%);
}

/* ── Shared accent colors ── */
:root {
  --accent:     #7c6af0;
  --accent2:    #9b8ff5;
  --accent-bg:  rgba(124,106,240,0.12);
  --green:      #3ecf8e;
  --green-bg:   rgba(62,207,142,0.12);
  --red:        #f06466;
  --red-bg:     rgba(240,100,102,0.12);
  --amber:      #f0a946;
  --amber-bg:   rgba(240,169,70,0.12);
  --blue:       #5ba3f5;
  --blue-bg:    rgba(91,163,245,0.12);
  --pink:       #e46db4;
  --radius:     14px;
  --radius-sm:  8px;
  --radius-lg:  20px;
  --font-display: 'Syne', sans-serif;
  --font-body:    'DM Sans', sans-serif;
  --tab-h:      68px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%; height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.3s, color 0.3s;
}

/* ── Shell ── */
.shell {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100dvh;
  background: var(--shell-bg);
  transition: background 0.4s;
}
.device {
  width: 390px; height: 844px;
  background: var(--bg2);
  border-radius: 44px;
  border: 1.5px solid var(--border2);
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
  box-shadow: var(--device-shadow);
  transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.notch {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  width: 126px; height: 34px;
  background: var(--bg);
  border-radius: 0 0 20px 20px;
  z-index: 100;
  transition: background 0.3s;
}

@media (max-width: 500px) {
  .shell { display: block; background: var(--bg2); }
  .device { width: 100vw; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
  .notch { display: none; }
}

/* ════════════════════════════════════════════
   LOGIN SCREEN
   ════════════════════════════════════════════ */
#page-login {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg2);
  transition: background 0.3s;
  z-index: 500;
  overflow-y: auto;
  scrollbar-width: none;
}
#page-login::-webkit-scrollbar { display: none; }

.login-hero {
  flex-shrink: 0;
  padding: calc(var(--sat) + 50px) 32px 36px;
  text-align: center;
  position: relative;
}
.login-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--login-glow);
  pointer-events: none;
}
.login-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}
.login-logo-icon {
  width: 52px; height: 52px;
  background: var(--accent);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 8px 24px rgba(124,106,240,0.4);
}
.login-logo-name {
  font-family: var(--font-display);
  font-size: 30px; font-weight: 800;
  letter-spacing: -1px;
  color: var(--text);
}
.login-tagline {
  font-size: 13px;
  color: var(--text3);
  margin-top: -6px;
}

.login-form {
  padding: 0 24px calc(var(--sab) + 32px);
  display: flex; flex-direction: column;
  gap: 14px;
  flex: 1;
}
.login-field {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.login-field:focus-within {
  border-color: var(--accent);
}
.login-field-icon { font-size: 18px; }
.login-input {
  flex: 1;
  background: transparent; border: none; outline: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
}
.login-input::placeholder { color: var(--text3); }
.login-btn {
  width: 100%; padding: 16px;
  background: var(--accent);
  border: none; border-radius: var(--radius);
  font-family: var(--font-display); font-size: 16px; font-weight: 700;
  color: white; cursor: pointer;
  box-shadow: 0 8px 20px rgba(124,106,240,0.35);
  transition: transform 0.15s;
}
.login-btn:active { transform: scale(0.97); }
.login-error {
  background: var(--red-bg);
  border: 1px solid rgba(240,100,102,0.25);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: var(--red);
  display: none;
}
.login-error.show { display: block; }
.login-hint {
  text-align: center;
  font-size: 11px;
  color: var(--text3);
  margin-top: 8px;
}

#page-login {
  opacity: 1;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
#page-login.exit {
  opacity: 0;
  transform: translateY(-24px);
  pointer-events: none;
}

/* ════════════════════════════════════════════
   APP SCREENS
   ════════════════════════════════════════════ */
.app-wrapper {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease 0.2s;
}
.app-wrapper.visible { opacity: 1; pointer-events: all; }

.screens { flex: 1; overflow: hidden; position: relative; padding-top: 44px; }
@media (max-width: 500px) { .screens { padding-top: max(44px, var(--sat)); } }

.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  padding-bottom: calc(var(--tab-h) + 16px + var(--sab));
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.active { opacity: 1; pointer-events: all; }

/* ── Top bar ── */
.top-bar {
  padding: 14px 20px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(to bottom, var(--bg2) 80%, transparent);
}
.top-bar h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.top-bar-right { display: flex; align-items: center; gap: 12px; }
.theme-toggle {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
}
.refresh-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent-bg); border: 1.5px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--accent2);
  cursor: pointer;
}

/* ── Tab bar ── */
.tab-bar {
  height: var(--tab-h); background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 8px calc(8px + var(--sab)); gap: 4px;
  flex-shrink: 0;
}
@media (max-width: 500px) { .tab-bar { height: calc(var(--tab-h) + var(--sab)); } }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; padding: 8px 4px; border-radius: var(--radius-sm);
  background: transparent; color: var(--text3);
  border: none;
}
.tab.active { color: var(--accent2); }
.tab svg { width: 22px; height: 22px; }
.tab span { font-size: 10px; font-weight: 500; }

/* ── Cards ── */
.section { padding: 0 20px 20px; }
.section-title {
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 12px; margin-top: 24px;
}
.positive { color: var(--green); }
.negative { color: var(--red); }

.balance-card {
  margin: 4px 20px 0; background: var(--bg3);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; position: relative; overflow: hidden;
}
.balance-card::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, var(--card-glow) 0%, transparent 70%);
  pointer-events: none;
}
.balance-label { font-size: 12px; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
.balance-value { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: -1px; margin-bottom: 16px; }
.balance-row { display: flex; gap: 12px; }
.balance-item {
  flex: 1; background: rgba(124,106,240,0.06); border-radius: var(--radius-sm); padding: 10px 12px;
}
.balance-item-label { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
.balance-item-val { font-size: 14px; font-weight: 500; }

.rankings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin: 20px;
}

.ranking-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.ranking-card h3 {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--text3);
  letter-spacing: 0.06em;
  margin-bottom: 12px;
}
.ranking-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.ranking-item:last-child { border-bottom: none; }
.ranking-name {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ranking-position {
  width: 24px; height: 24px;
  background: var(--bg4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
  color: var(--text2);
}
.ranking-position.gold { background: #ffd700; color: #333; }
.ranking-position.silver { background: #c0c0c0; color: #333; }
.ranking-position.bronze { background: #cd7f32; color: white; }
.ranking-value { font-weight: 600; color: var(--red); }
.ranking-value.invest { color: var(--green); }

.tx-list { display: flex; flex-direction: column; gap: 2px; }
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  cursor: pointer;
}
.tx-item:active { background: var(--bg3); }
.tx-icon {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  background: var(--accent-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.tx-info { flex: 1; min-width: 0; }
.tx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-cat { font-size: 11px; color: var(--text3); margin-top: 1px; }
.tx-amount { font-size: 14px; font-weight: 600; text-align: right; }
.tx-date { font-size: 10px; color: var(--text3); text-align: right; margin-top: 2px; }

/* Dashboard */
.chart-container {
  margin: 0 20px 16px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.chart-title {
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
canvas { max-height: 180px; width: 100% !important; }

/* Tabela Geral */
.export-buttons {
  display: flex;
  gap: 10px;
  margin: 16px 20px;
  justify-content: flex-end;
}
.btn-export {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
}
.btn-export.excel { background: var(--green); color: white; }
.btn-export.csv { background: var(--blue); color: white; }
.btn-refresh { background: var(--accent); color: white; }

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 20px 16px;
}
.filters select, .filters input {
  padding: 8px 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 12px;
}

.table-container {
  margin: 0 20px 20px;
  overflow-x: auto;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th, td {
  padding: 10px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  color: var(--text3);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.03em;
}

.loading {
  text-align: center;
  padding: 40px;
  color: var(--text3);
}
.notification {
  position: fixed;
  bottom: 80px;
  left: 20px;
  right: 20px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: var(--text);
  z-index: 200;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="device">
    <div class="notch"></div>

    <!-- Login Screen -->
    <div id="page-login">
      <div class="login-hero">
        <div class="login-logo">
          <div class="login-logo-icon">💰</div>
          <div class="login-logo-name">Merkai</div>
        </div>
        <div class="login-tagline">finanças que fazem sentido</div>
      </div>
      <div class="login-form">
        <div class="login-error" id="loginError">❌ Usuário ou senha incorretos</div>
        <div class="login-field">
          <span class="login-field-icon">👤</span>
          <input type="text" class="login-input" id="loginUser" placeholder="Usuário" value="admin">
        </div>
        <div class="login-field">
          <span class="login-field-icon">🔒</span>
          <input type="password" class="login-input" id="loginPass" placeholder="Senha" value="">
        </div>
        <button class="login-btn" id="loginBtn">Entrar</button>
        <div class="login-hint">
          🔑 Dica: usuário <strong>admin</strong> | senha <strong>merkai</strong>
        </div>
      </div>
    </div>

    <!-- App Wrapper -->
    <div class="app-wrapper" id="appWrapper">
      <div class="screens">
        <!-- HOME Screen -->
        <div class="screen active" id="screen-home">
          <div class="top-bar">
            <h1>Olá,<br><span id="userNameDisplay">Visitante</span></h1>
            <div class="top-bar-right">
              <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
              <button class="refresh-btn" onclick="forcarAtualizacao()">🔄</button>
              <div class="avatar" onclick="logout()">👤</div>
            </div>
          </div>
          <div id="homeContent">
            <div class="loading">Carregando...</div>
          </div>
        </div>

        <!-- DASHBOARD Screen -->
        <div class="screen" id="screen-dashboard">
          <div class="top-bar">
            <h1>Dashboard</h1>
            <div class="top-bar-right">
              <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
              <div class="avatar" onclick="logout()">👤</div>
            </div>
          </div>
          <div id="dashboardContent">
            <div class="loading">Carregando gráficos...</div>
          </div>
        </div>

        <!-- GERAL Screen -->
        <div class="screen" id="screen-geral">
          <div class="top-bar">
            <h1>Registros</h1>
            <div class="top-bar-right">
              <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
              <div class="avatar" onclick="logout()">👤</div>
            </div>
          </div>
          <div id="geralContent">
            <div class="loading">Carregando...</div>
          </div>
        </div>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab active" data-screen="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3L21 9.5M5 10.5V20H19V10.5M12 17V14"/></svg>
          <span>Home</span>
        </button>
        <button class="tab" data-screen="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4H20V20H4V4Z M8 8H16V12H8V8Z M8 14H12V16H8V14Z"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="tab" data-screen="geral">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4H20V8H4V4Z M4 10H20V14H4V10Z M4 16H20V20H4V16Z"/></svg>
          <span>Registros</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================
// CONFIGURAÇÕES
// ============================================
const PLANILHA_URL = "https://docs.google.com/spreadsheets/d/10rAYr6HVqSoI8doun6btTfLTvvu0uu2rPMoRBGYzO6Q/edit?usp=sharing";
const PLANILHA_ID = PLANILHA_URL.match(/\/d\/([a-zA-Z0-9_-]+)/)[1];

let dadosCompletos = [];
let carregando = false;
let chartCategoria, chartDescricao, chartPagamento, chartNecessidade, chartDias;

// ============================================
// TEMA (Dark/Light)
// ============================================
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const newTheme = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('merkai-theme', newTheme);
  const toggleBtn = document.getElementById('themeToggle');
  if (toggleBtn) toggleBtn.innerHTML = newTheme === 'dark' ? '🌙' : '☀️';
}
const savedTheme = localStorage.getItem('merkai-theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

// ============================================
// LOGIN - CORRIGIDO!
// ============================================
let isLoggedIn = false;

function doLogin() {
  const user = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  const errorDiv = document.getElementById('loginError');
  
  // Credenciais corretas
  if (user === 'admin' && pass === 'merkai')
