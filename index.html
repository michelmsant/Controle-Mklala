<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Merkai Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens dark ── */
[data-theme="dark"] {
  --bg:        #0f0f12;
  --bg2:       #16161a;
  --bg3:       #1e1e24;
  --bg4:       #26262e;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --text:      #f0eff4;
  --text2:     #9896a6;
  --text3:     #5c5b6a;
  --shadow:    rgba(0,0,0,0.5);
  --card-glow: rgba(124,106,240,0.18);
  --shell-bg:  radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,106,240,0.14) 0%, transparent 70%);
  --device-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 40px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
}

/* ── Tokens light ── */
[data-theme="light"] {
  --bg:        #f5f4f8;
  --bg2:       #ffffff;
  --bg3:       #f0eef6;
  --bg4:       #e6e3f0;
  --border:    rgba(0,0,0,0.07);
  --border2:   rgba(0,0,0,0.12);
  --text:      #1a1828;
  --text2:     #6b6880;
  --text3:     #a09eb0;
  --shadow:    rgba(100,90,160,0.10);
  --card-glow: rgba(124,106,240,0.08);
  --shell-bg:  radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,106,240,0.07) 0%, transparent 70%);
  --device-shadow: 0 0 0 1px rgba(124,106,240,0.12), 0 32px 60px rgba(100,90,160,0.18), inset 0 1px 0 rgba(255,255,255,0.8);
}

/* ── Shared accent colors ── */
:root {
  --accent:     #7c6af0;
  --accent2:    #9b8ff5;
  --accent-bg:  rgba(124,106,240,0.12);
  --green:      #3ecf8e;
  --green-bg:   rgba(62,207,142,0.12);
  --red:        #f06466;
  --red-bg:     rgba(240,100,102,0.12);
  --amber:      #f0a946;
  --amber-bg:   rgba(240,169,70,0.12);
  --blue:       #5ba3f5;
  --blue-bg:    rgba(91,163,245,0.12);
  --radius:     14px;
  --radius-sm:  8px;
  --radius-lg:  20px;
  --font-display: 'Syne', sans-serif;
  --font-body:    'DM Sans', sans-serif;
  --tab-h:      68px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%; height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.3s, color 0.3s;
}

/* ── Shell ── */
.shell {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100dvh;
  background: var(--shell-bg);
  transition: background 0.4s;
}
.device {
  width: 390px; height: 844px;
  background: var(--bg2);
  border-radius: 44px;
  border: 1.5px solid var(--border2);
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
  box-shadow: var(--device-shadow);
  transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.notch {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  width: 126px; height: 34px;
  background: var(--bg);
  border-radius: 0 0 20px 20px;
  z-index: 100;
  transition: background 0.3s;
}

@media (max-width: 500px) {
  .shell { display: block; background: var(--bg2); }
  .device { width: 100vw; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
  .notch { display: none; }
}

/* ════════════════════════════════════════════
   APP SCREENS
   ════════════════════════════════════════════ */
.app-wrapper {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  opacity: 1;
  pointer-events: all;
}

.screens { flex: 1; overflow: hidden; position: relative; padding-top: 44px; }
@media (max-width: 500px) { .screens { padding-top: max(44px, var(--sat)); } }

.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  padding-bottom: calc(var(--tab-h) + 16px + var(--sab));
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.active { opacity: 1; pointer-events: all; }

/* ── Top bar ── */
.top-bar {
  padding: 14px 20px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(to bottom, var(--bg2) 80%, transparent);
}
.top-bar h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.top-bar-right { display: flex; align-items: center; gap: 12px; }
.theme-toggle {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
}
.refresh-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent-bg); border: 1.5px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 13px; font-weight: 700; color: var(--accent2);
}

/* ── Tab bar ── */
.tab-bar {
  height: var(--tab-h); background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 8px calc(8px + var(--sab)); gap: 4px;
  flex-shrink: 0;
}
@media (max-width: 500px) { .tab-bar { height: calc(var(--tab-h) + var(--sab)); } }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; padding: 8px 4px; border-radius: var(--radius-sm);
  background: transparent; color: var(--text3);
  border: none;
}
.tab.active { color: var(--accent2); }
.tab svg { width: 22px; height: 22px; }
.tab span { font-size: 10px; font-weight: 500; }

/* ── Cards ── */
.section { padding: 0 20px 20px; }
.section-title {
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 12px; margin-top: 24px;
}
.positive { color: var(--green); }
.negative { color: var(--red); }

.balance-card {
  margin: 4px 20px 0; background: var(--bg3);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; position: relative; overflow: hidden;
}
.balance-card::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, var(--card-glow) 0%, transparent 70%);
  pointer-events: none;
}
.balance-label { font-size: 12px; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
.balance-value { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: -1px; margin-bottom: 16px; }
.balance-row { display: flex; gap: 12px; }
.balance-item {
  flex: 1; background: rgba(124,106,240,0.06); border-radius: var(--radius-sm); padding: 10px 12px;
}
.balance-item-label { font-size: 10px; color: var(--text3); margin-bottom: 3px; }
.balance-item-val { font-size: 14px; font-weight: 500; }

.rankings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin: 20px;
}

.ranking-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.ranking-card h3 {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--text3);
  letter-spacing: 0.06em;
  margin-bottom: 12px;
}
.ranking-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.ranking-item:last-child { border-bottom: none; }
.ranking-name {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ranking-position {
  width: 24px; height: 24px;
  background: var(--bg4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
  color: var(--text2);
}
.ranking-position.gold { background: #ffd700; color: #333; }
.ranking-position.silver { background: #c0c0c0; color: #333; }
.ranking-position.bronze { background: #cd7f32; color: white; }
.ranking-value { font-weight: 600; color: var(--red); }
.ranking-value.invest { color: var(--green); }

.tx-list { display: flex; flex-direction: column; gap: 2px; }
.tx-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  cursor: pointer;
}
.tx-item:active { background: var(--bg3); }
.tx-icon {
  width: 40px; height: 40px; border-radius: var(--radius-sm);
  background: var(--accent-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.tx-info { flex: 1; min-width: 0; }
.tx-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-cat { font-size: 11px; color: var(--text3); margin-top: 1px; }
.tx-amount { font-size: 14px; font-weight: 600; text-align: right; }
.tx-date { font-size: 10px; color: var(--text3); text-align: right; margin-top: 2px; }

/* Dashboard */
.chart-container {
  margin: 0 20px 16px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.chart-title {
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
canvas { max-height: 180px; width: 100% !important; }

/* Tabela Geral */
.export-buttons {
  display: flex;
  gap: 10px;
  margin: 16px 20px;
  justify-content: flex-end;
}
.btn-export {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
}
.btn-export.excel { background: var(--green); color: white; }
.btn-export.csv { background: var(--blue); color: white; }
.btn-refresh { background: var(--accent); color: white; }

.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0 20px 16px;
}
.filters select, .filters input {
  padding: 8px 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 12px;
}

.table-container {
  margin: 0 20px 20px;
  overflow-x: auto;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th, td {
  padding: 10px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  color: var(--text3);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.03em;
}

.loading {
  text-align: center;
  padding: 40px;
  color: var(--text3);
}
.notification {
  position: fixed;
  bottom: 80px;
  left: 20px;
  right: 20px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: var(--text);
  z-index: 200;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="device">
    <div class="notch"></div>

    <!-- App Wrapper - Sem tela de login -->
    <div class="app-wrapper">
      <div class="screens">
        <!-- HOME Screen -->
        <div class="screen active" id="screen-home">
          <div class="top-bar">
            <h1>Olá,<br><span id="userNameDisplay">Família</span></h1>
            <div class="top-bar-right">
              <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
              <button class="refresh-btn" onclick="forcarAtualizacao()">🔄</button>
              <div class="avatar">👤</div>
            </div>
          </div>
          <div id="homeContent">
            <div class="loading">Carregando...</div>
          </div>
        </div>

        <!-- DASHBOARD Screen -->
        <div class="screen" id="screen-dashboard">
          <div class="top-bar">
            <h1>Dashboard</h1>
            <div class="top-bar-right">
              <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
              <div class="avatar">👤</div>
            </div>
          </div>
          <div id="dashboardContent">
            <div class="loading">Carregando gráficos...</div>
          </div>
        </div>

        <!-- GERAL Screen -->
        <div class="screen" id="screen-geral">
          <div class="top-bar">
            <h1>Registros</h1>
            <div class="top-bar-right">
              <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
              <div class="avatar">👤</div>
            </div>
          </div>
          <div id="geralContent">
            <div class="loading">Carregando...</div>
          </div>
        </div>
      </div>

      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab active" data-screen="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9.5L12 3L21 9.5M5 10.5V20H19V10.5M12 17V14"/></svg>
          <span>Home</span>
        </button>
        <button class="tab" data-screen="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4H20V20H4V4Z M8 8H16V12H8V8Z M8 14H12V16H8V14Z"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="tab" data-screen="geral">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4H20V8H4V4Z M4 10H20V14H4V10Z M4 16H20V20H4V16Z"/></svg>
          <span>Registros</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================
// CONFIGURAÇÕES
// ============================================
const PLANILHA_URL = "https://docs.google.com/spreadsheets/d/10rAYr6HVqSoI8doun6btTfLTvvu0uu2rPMoRBGYzO6Q/edit?usp=sharing";
const PLANILHA_ID = PLANILHA_URL.match(/\/d\/([a-zA-Z0-9_-]+)/)[1];

let dadosCompletos = [];
let carregando = false;
let chartCategoria, chartDescricao, chartPagamento, chartNecessidade, chartDias;

// ============================================
// TEMA (Dark/Light)
// ============================================
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const newTheme = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('merkai-theme', newTheme);
  const toggleBtn = document.getElementById('themeToggle');
  if (toggleBtn) toggleBtn.innerHTML = newTheme === 'dark' ? '🌙' : '☀️';
}
const savedTheme = localStorage.getItem('merkai-theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

// ============================================
// TABS
// ============================================
const tabs = document.querySelectorAll('.tab');
const screens = {
  home: document.getElementById('screen-home'),
  dashboard: document.getElementById('screen-dashboard'),
  geral: document.getElementById('screen-geral')
};

function switchScreen(screenId) {
  Object.keys(screens).forEach(id => {
    screens[id].classList.remove('active');
  });
  screens[screenId].classList.add('active');
  tabs.forEach(tab => {
    tab.classList.remove('active');
    if (tab.getAttribute('data-screen') === screenId) tab.classList.add('active');
  });
}

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const screenId = tab.getAttribute('data-screen');
    switchScreen(screenId);
    if (screenId === 'dashboard') atualizarDashboard();
    if (screenId === 'geral') atualizarTabelaGeral();
  });
});

// ============================================
// CARREGAR DADOS
// ============================================
async function carregarDados() {
  if (carregando) return;
  carregando = true;
  mostrarNotificacao('🔄 Carregando dados da planilha...', '#7c6af0');
  
  try {
    const url = `https://docs.google.com/spreadsheets/d/${PLANILHA_ID}/gviz/tq?tqx=out:json`;
    const resposta = await fetch(url);
    const texto = await resposta.text();
    const jsonString = texto.substring(47, texto.length - 2);
    const dados = JSON.parse(jsonString);
    
    if (dados.table && dados.table.rows) {
      const cabecalhos = dados.table.cols.map(col => col.label);
      const linhas = dados.table.rows.map(row => {
        const obj = {};
        row.c.forEach((celula, index) => {
          if (cabecalhos[index] && celula && celula.v !== null) {
            obj[cabecalhos[index]] = celula.v;
          }
        });
        return obj;
      }).filter(row => Object.keys(row).length > 0);
      
      processarDados(linhas);
      mostrarNotificacao('✅ Dados carregados com sucesso!', '#3ecf8e');
    } else {
      throw new Error('Nenhum dado encontrado');
    }
  } catch (erro) {
    console.error(erro);
    mostrarNotificacao('❌ Erro ao carregar dados. Usando dados de exemplo.', '#f06466');
    carregarExemplo();
  }
  carregando = false;
}

function extrairData(val) {
  if (!val) return '';
  if (typeof val === 'string') {
    const match = val.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (match) return `${match[3]}-${match[2]}-${match[1]}`;
    const d = new Date(val);
    if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
  }
  if (typeof val === 'number') {
    const d = new Date((val - 25569) * 86400000);
    if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
  }
  return '';
}

function formatarData(dataStr) {
  if (!dataStr) return '-';
  try {
    const d = new Date(dataStr);
    return d.toLocaleDateString('pt-BR');
  } catch(e) { return dataStr; }
}

function processarDados(dados) {
  dadosCompletos = dados.map(linha => {
    let data = '', tipo = 'Receita', categoria = 'Outros', descricao = '';
    let valor = 0, formaPagamento = 'Outros', necessidade = 'Média', registro = '';
    
    Object.keys(linha).forEach(chave => {
      const chaveLower = chave.toLowerCase();
      const val = linha[chave];
      
      if (chaveLower === 'data' || chaveLower.includes('data') || chaveLower === 'carimbo de data/hora') data = extrairData(val);
      else if (chaveLower === 'tipo' || chaveLower.includes('tipo')) tipo = String(val).toLowerCase().includes('despesa') ? 'Despesa' : 'Receita';
      else if (chaveLower === 'categoria' || chaveLower.includes('categoria')) categoria = val || 'Outros';
      else if (chaveLower.includes('descrição') || chaveLower.includes('descricao')) descricao = val || '';
      else if (chaveLower === 'valor' || chaveLower.includes('valor')) valor = typeof val === 'number' ? val : parseFloat(String(val).replace('R$', '').replace(/\./g, '').replace(',', '.')) || 0;
      else if (chaveLower.includes('pagamento') || chaveLower === 'forma de pagamento') formaPagamento = val || 'Outros';
      else if (chaveLower === 'necessidade' || chaveLower.includes('necessidade')) necessidade = val || 'Média';
      else if (chaveLower === 'registro' || chaveLower.includes('registro')) registro = val || 'Não informado';
    });
    
    return { data, tipo, categoria, descricao, valor, formaPagamento, necessidade, registro };
  }).filter(item => item.valor > 0);
  
  atualizarHome();
  atualizarDashboard();
  atualizarTabelaGeral();
}

// ============================================
// HOME
// ============================================
function atualizarHome() {
  const receitas = dadosCompletos.filter(i => i.tipo === 'Receita').reduce((s, i) => s + i.valor, 0);
  const despesas = dadosCompletos.filter(i => i.tipo === 'Despesa').reduce((s, i) => s + i.valor, 0);
  const saldo = receitas - despesas;
  
  const categoriasInvestimento = ['Investimento', 'Poupança', 'Ações', 'Previdência', 'FIIs', 'CDB', 'Tesouro'];
  const investimentos = dadosCompletos.filter(i => i.tipo === 'Despesa' && categoriasInvestimento.some(cat => i.categoria.includes(cat))).reduce((s, i) => s + i.valor, 0);
  
  const despesasPorRegistro = {};
  dadosCompletos.filter(i => i.tipo === 'Despesa').forEach(i => {
    const registro = i.registro || 'Não informado';
    despesasPorRegistro[registro] = (despesasPorRegistro[registro] || 0) + i.valor;
  });
  const rankingDespesas = Object.entries(despesasPorRegistro).sort((a,b) => b[1] - a[1]).slice(0, 5);
  
  const investimentosPorRegistro = {};
  dadosCompletos.filter(i => i.tipo === 'Despesa' && categoriasInvestimento.some(cat => i.categoria.includes(cat))).forEach(i => {
    const registro = i.registro || 'Não informado';
    investimentosPorRegistro[registro] = (investimentosPorRegistro[registro] || 0) + i.valor;
  });
  const rankingInvestimentos = Object.entries(investimentosPorRegistro).sort((a,b) => b[1] - a[1]).slice(0, 5);
  
  const ultimos = [...dadosCompletos].sort((a,b) => b.data.localeCompare(a.data)).slice(0, 10);
  
  const html = `
    <div class="balance-card">
      <div class="balance-label">Saldo disponível</div>
      <div class="balance-value ${saldo >= 0 ? 'positive' : 'negative'}">R$ ${saldo.toFixed(2)}</div>
      <div class="balance-row">
        <div class="balance-item"><div class="balance-item-label">💰 Receitas</div><div class="balance-item-val positive">R$ ${receitas.toFixed(2)}</div></div>
        <div class="balance-item"><div class="balance-item-label">💸 Despesas</div><div class="balance-item-val negative">R$ ${despesas.toFixed(2)}</div></div>
        <div class="balance-item"><div class="balance-item-label">📈 Investido</div><div class="balance-item-val" style="color: var(--amber)">R$ ${investimentos.toFixed(2)}</div></div>
      </div>
    </div>
    
    <div class="rankings-grid">
      <div class="ranking-card">
        <h3>🏆 Quem mais gera despesa</h3>
        ${rankingDespesas.map(([nome, valor], idx) => `
          <div class="ranking-item">
            <div class="ranking-name">
              <div class="ranking-position ${idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : ''}">${idx + 1}</div>
              <span>${nome}</span>
            </div>
            <div class="ranking-value">R$ ${valor.toFixed(2)}</div>
          </div>
        `).join('') || '<div class="ranking-item">Nenhum dado</div>'}
      </div>
      <div class="ranking-card">
        <h3>📈 Investimentos por registro</h3>
        ${rankingInvestimentos.map(([nome, valor], idx) => `
          <div class="ranking-item">
            <div class="ranking-name">
              <div class="ranking-position ${idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : ''}">${idx + 1}</div>
              <span>${nome}</span>
            </div>
            <div class="ranking-value invest">R$ ${valor.toFixed(2)}</div>
          </div>
        `).join('') || '<div class="ranking-item">Nenhum investimento registrado</div>'}
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">Últimos lançamentos</div>
      <div class="tx-list">
        ${ultimos.map(i => `
          <div class="tx-item">
            <div class="tx-icon">${i.tipo === 'Receita' ? '💰' : '💸'}</div>
            <div class="tx-info">
              <div class="tx-name">${i.descricao || i.categoria}</div>
              <div class="tx-cat">${i.categoria} • ${i.registro || '-'}</div>
            </div>
            <div style="text-align: right">
              <div class="tx-amount ${i.tipo === 'Receita' ? 'positive' : 'negative'}">R$ ${i.valor.toFixed(2)}</div>
              <div class="tx-date">${formatarData(i.data)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('homeContent').innerHTML = html;
}

// ============================================
// DASHBOARD
// ============================================
function atualizarDashboard() {
  const despesas = dadosCompletos.filter(i => i.tipo === 'Despesa');
  
  const porCategoria = {};
  despesas.forEach(i => { porCategoria[i.categoria] = (porCategoria[i.categoria] || 0) + i.valor; });
  
  const porDescricao = {};
  despesas.forEach(i => { porDescricao[i.descricao || 'Sem descrição'] = (porDescricao[i.descricao || 'Sem descrição'] || 0) + i.valor; });
  const descSorted = Object.entries(porDescricao).sort((a,b) => b[1] - a[1]).slice(0, 5);
  
  const porPagamento = {};
  dadosCompletos.forEach(i => { porPagamento[i.formaPagamento] = (porPagamento[i.formaPagamento] || 0) + i.valor; });
  
  const porNecessidade = {};
  despesas.forEach(i => { porNecessidade[i.necessidade] = (porNecessidade[i.necessidade] || 0) + i.valor; });
  
  const porDia = {};
  despesas.forEach(i => { if (i.data) { const dia = formatarData(i.data); porDia[dia] = (porDia[dia] || 0) + i.valor; } });
  const diasSorted = Object.entries(porDia).sort((a,b) => b[1] - a[1]).slice(0, 7);
  
  const html = `
    <div class="chart-container">
      <div class="chart-title">📊 Despesas por categoria</div>
      <canvas id="catChart"></canvas>
    </div>
    <div class="chart-container">
      <div class="chart-title">🏷️ Despesas por descrição (top 5)</div>
      <canvas id="descChart"></canvas>
    </div>
    <div class="chart-container">
      <div class="chart-title">💳 Formas de pagamento</div>
      <canvas id="payChart"></canvas>
    </div>
    <div class="chart-container">
      <div class="chart-title">⚠️ Índice de necessidade</div>
      <canvas id="needChart"></canvas>
    </div>
    <div class="chart-container">
      <div class="chart-title">📅 Dias com mais despesas</div>
      <canvas id="dayChart"></canvas>
    </div>
  `;
  document.getElementById('dashboardContent').innerHTML = html;
  
  setTimeout(() => {
    if (chartCategoria) chartCategoria.destroy();
    const ctx1 = document.getElementById('catChart');
    if (ctx1) {
      chartCategoria = new Chart(ctx1, {
        type: 'pie', data: { labels: Object.keys(porCategoria), datasets: [{ data: Object.values(porCategoria), backgroundColor: ['#FF6384','#36A2EB','#FFCE56','#4BC0C0','#9966FF','#FF9F40'] }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } }
      });
    }
    
    if (chartDescricao) chartDescricao.destroy();
    const ctx2 = document.getElementById('descChart');
    if (ctx2) {
      chartDescricao = new Chart(ctx2, {
        type: 'pie', data: { labels: descSorted.map(d => d[0]), datasets: [{ data: descSorted.map(d => d[1]), backgroundColor: ['#FF9F40','#FF6384','#36A2EB','#FFCE56','#4BC0C0'] }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } }
      });
    }
    
    if (chartPagamento) chartPagamento.destroy();
    const ctx3 = document.getElementById('payChart');
    if (ctx3) {
      chartPagamento = new Chart(ctx3, {
        type: 'doughnut', data: { labels: Object.keys(porPagamento), datasets: [{ data: Object.values(porPagamento), backgroundColor: ['#4BC0C0','#FF9F40','#FF6384','#36A2EB'] }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } }
      });
    }
    
    if (chartNecessidade) chartNecessidade.destroy();
    const ctx4 = document.getElementById('needChart');
    if (ctx4) {
      chartNecessidade = new Chart(ctx4, {
        type: 'bar', data: { labels: Object.keys(porNecessidade), datasets: [{ data: Object.values(porNecessidade), backgroundColor: '#7c6af0' }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
      });
    }
    
    if (chartDias) chartDias.destroy();
    const ctx5 = document.getElementById('dayChart');
    if (ctx5) {
      chartDias = new Chart(ctx5, {
        type: 'bar', data: { labels: diasSorted.map(d => d[0]), datasets: [{ data: diasSorted.map(d => d[1]), backgroundColor: '#f0a946' }] },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
      });
    }
  }, 100);
}

// ============================================
// GERAL
// ============================================
function atualizarTabelaGeral() {
  const html = `
    <div class="export-buttons">
      <button class="btn-export excel" onclick="exportarExcel()">📊 Excel</button>
      <button class="btn-export csv" onclick="exportarCSV()">📄 CSV</button>
      <button class="btn-refresh" onclick="forcarAtualizacao()">🔄 Atualizar</button>
    </div>
    <div class="filters">
      <select id="filterCategoria" onchange="filtrarTabelaGeral()"><option value="">Todas categorias</option></select>
      <select id="filterTipo" onchange="filtrarTabelaGeral()"><option value="">Todos os tipos</option><option value="Receita">💰 Receitas</option><option value="Despesa">💸 Despesas</option></select>
      <input type="month" id="filterMes" onchange="filtrarTabelaGeral()">
    </div>
    <div class="table-container" id="tabelaGeralContainer"></div>
  `;
  document.getElementById('geralContent').innerHTML = html;
  atualizarFiltrosEOLista();
}

function atualizarFiltrosEOLista() {
  const categorias = [...new Set(dadosCompletos.map(i => i.categoria))];
  const selectCat = document.getElementById('filterCategoria');
  if (selectCat) {
    const atual = selectCat.value;
    selectCat.innerHTML = '<option value="">Todas categorias</option>' + categorias.sort().map(c => `<option value="${c}" ${c === atual ? 'selected' : ''}>${c}</option>`).join('');
  }
  filtrarTabelaGeral();
}

function filtrarTabelaGeral() {
  const cat = document.getElementById('filterCategoria')?.value || '';
  const tipo = document.getElementById('filterTipo')?.value || '';
  const mes = document.getElementById('filterMes')?.value || '';
  
  let filtrados = [...dadosCompletos];
  if (cat) filtrados = filtrados.filter(i => i.categoria === cat);
  if (tipo) filtrados = filtrados.filter(i => i.tipo === tipo);
  if (mes) filtrados = filtrados.filter(i => i.data && i.data.substring(0, 7) === mes);
  
  const container = document.getElementById('tabelaGeralContainer');
  if (container) {
    container.innerHTML = `
      <table>
        <thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Pagamento</th><th>Necessidade</th><th>Registro</th></tr></thead>
        <tbody>
          ${filtrados.sort((a,b) => b.data.localeCompare(a.data)).map(i => `
            <tr>
              <td>${formatarData(i.data)}</td>
              <td style="color: ${i.tipo === 'Receita' ? '#3ecf8e' : '#f06466'}">${i.tipo}</td>
              <td>${i.categoria}</td>
              <td>${i.descricao || '-'}</td>
              <td style="color: ${i.tipo === 'Receita' ? '#3ecf8e' : '#f06466'}">R$ ${i.valor.toFixed(2)}</td>
              <td>${i.formaPagamento}</td>
              <td>${i.necessidade}</td>
              <td>${i.registro || '-'}</td>
            </tr>
          `).join('')}
          ${filtrados.length === 0 ? '<tr><td colspan="8">Nenhum dado encontrado</td>' : ''}
        </tbody>
      </table>
    `;
  }
}

// ============================================
// EXPORT
// ============================================
function exportarExcel() {
  const dadosExport = dadosCompletos.map(i => ({
    Data: formatarData(i.data), Tipo: i.tipo, Categoria: i.categoria,
    Descricao: i.descricao, Valor: i.valor, FormaPagamento: i.formaPagamento,
    Necessidade: i.necessidade, Registro: i.registro
  }));
  const ws = XLSX.utils.json_to_sheet(dadosExport);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Merkai_Finance');
  XLSX.writeFile(wb, `Merkai_Finance_${new Date().toISOString().split('T')[0]}.xlsx`);
  mostrarNotificacao('✅ Excel exportado!', '#3ecf8e');
}

function exportarCSV() {
  const header = 'Data;Tipo;Categoria;Descricao;Valor;FormaPagamento;Necessidade;Registro\n';
  const dadosExport = dadosCompletos.map(i => `${formatarData(i.data)};${i.tipo};${i.categoria};${i.descricao};${i.valor};${i.formaPagamento};${i.necessidade};${i.registro}`).join('\n');
  const blob = new Blob([header + dadosExport], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Merkai_Finance_${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
  mostrarNotificacao('✅ CSV exportado!', '#5ba3f5');
}

function forcarAtualizacao() {
  carregarDados();
}

function mostrarNotificacao(msg, cor = '#7c6af0') {
  const notif = document.createElement('div');
  notif.className = 'notification';
  notif.style.background = cor;
  notif.style.color = 'white';
  notif.innerText = msg;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 2500);
}
